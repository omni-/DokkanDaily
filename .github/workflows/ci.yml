name: 'ci'
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
      - cron: '30 15 * * WED'
  workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: src/DokkanDaily
  DACPAC_NAME: DokkanDailyDB.dacpac
jobs:
  db-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Build (Database)
      run: msbuild /m /t:Rebuild /p:Configuration=${{ env.CONFIGURATION }} ./src/DokkanDailyDB /p:OutputPath=../../Dacpac
      
    - name: Publish Artifacts (Database)
      uses: actions/upload-artifact@v4
      with:
        name: database
        path: Dacpac/${{ env.DACPAC_NAME }}    

  build:
    runs-on: ubuntu-latest
    needs: db-build
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
        
    - name: Install OCR native dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libc6-dev \
          libdrm2 \
          libgtk-3-0 \
          libleptonica-dev \
          libtesseract-dev
        
    - name: Restore
      run: dotnet restore ./tests/DokkanDailyTests/DokkanDailyTests.csproj
      
    - name: Build
      run: dotnet build ./tests/DokkanDailyTests/DokkanDailyTests.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Configure OCR native libraries
      shell: bash
      run: |
        set -euo pipefail

        target_framework="$(dotnet msbuild ./tests/DokkanDailyTests/DokkanDailyTests.csproj \
          -getProperty:TargetFramework \
          -property:Configuration=${CONFIGURATION})"
        native_directory="$GITHUB_WORKSPACE/tests/DokkanDailyTests/bin/${CONFIGURATION}/${target_framework}/x64"
        mkdir -p "$native_directory"

        tesseract_library="$(ldconfig -p | awk '$1 ~ /^libtesseract\.so(\.|$)/ { print $NF; exit }')"
        leptonica_library="$(ldconfig -p | awk '$1 ~ /^liblept\.so(\.|$)/ { print $NF; exit }')"
        dl_library="$(ldconfig -p | awk '$1 == "libdl.so.2" { print $NF; exit }')"

        test -n "$tesseract_library"
        test -n "$leptonica_library"
        test -n "$dl_library"

        ln -sf "$tesseract_library" "$native_directory/libtesseract50.so"
        ln -sf "$leptonica_library" "$native_directory/libleptonica-1.82.0.so"
        ln -sf "$dl_library" "$native_directory/libdl.so"

        printf 'LD_LIBRARY_PATH=%s:%s\n' "$native_directory" "${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      
    - name: Download artifact (Database)
      uses: actions/download-artifact@v4
      with:
        name: database
        path: src/DokkanDailyDB/Dacpac
    
    - name: Setup SQL Server Container
      run: |
        cd src/DokkanDailyDB/
        docker build . --build-arg PASSWORD="<YourStrong@Passw0rd>" -t mydatabase:1.0 --no-cache
        docker run -p 127.0.0.1:1433:1433 --name sqldb -d mydatabase:1.0

        for attempt in {1..60}; do
          if docker exec sqldb /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "<YourStrong@Passw0rd>" \
            -C \
            -d mydatabase \
            -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server is ready."
            break
          fi

          if [ "$attempt" -eq 60 ]; then
            echo "SQL Server did not become ready within 60 seconds."
            docker logs sqldb
            exit 1
          fi

          sleep 1
        done

        cd ../..
      
    - name: Test
      run: >-
        dotnet test ./tests/DokkanDailyTests/DokkanDailyTests.csproj
        --configuration ${{ env.CONFIGURATION }}
        --no-build
        --verbosity normal
        --collect:"XPlat Code Coverage"
        --logger trx
        --results-directory "${{ github.workspace }}/TestResults"
      
    - name: Summarize code coverage
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: TestResults/**/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both
        thresholds: "10 30"

    - name: Add coverage PR comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: TestResults
        retention-days: 5

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2.23.0
      if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      with:
        files: TestResults/**/*.trx
        comment_mode: off
      
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [build, db-deploy]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
  
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: dokkandaily
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        run: |
          docker build . -t ghcr.io/dokkandaily/dokkandaily:${{ github.sha }}
          docker push ghcr.io/dokkandaily/dokkandaily:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: DokkanDaily
          publish-profile: ${{ secrets.DOKKANDAILYPUBLISHSETTINGS }}
          images: ghcr.io/dokkandaily/dokkandaily:${{ github.sha }}

  db-deploy:
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
    - name: Download artifact (Database)
      uses: actions/download-artifact@v4
      with:
        name: database
        path: .
          
    - name: Login to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Deploy DACPAC to Azure
      uses: azure/sql-action@v2.3
      with:
        connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
        path: './${{ env.DACPAC_NAME }}'
        action: 'publish'
        arguments: '/p:DropObjectsNotInSource=false'
    
    - name: Logout from Azure
      run: |
        az logout
